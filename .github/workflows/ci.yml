# DEVOPS-01-001 — Validación de cada Pull Request y de main.
# Bloquea el merge si falla la compilación, las pruebas (incluidas las de arquitectura),
# el escaneo de secretos o la construcción de la imagen.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar
        run: dotnet restore Ieh.OwneyBeauty.slnx

      - name: Compilar
        run: dotnet build Ieh.OwneyBeauty.slnx -c Release --no-restore

      - name: Pruebas (dominio, integración y arquitectura)
        run: dotnet test Ieh.OwneyBeauty.slnx -c Release --no-build --logger "trx" --results-directory TestResults

      - name: Publicar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

      - name: Paquetes con vulnerabilidades conocidas
        run: |
          dotnet list Ieh.OwneyBeauty.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::warning::Hay paquetes con vulnerabilidades conocidas. Revisa vulnerable.txt."
          fi

  secrets:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construir imagen (sin publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: owney-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
